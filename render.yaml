services:
  - type: web
    name: savedpocket
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /
    disk:
      name: savedpocket-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: savedpocket-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false  # Set to your Render web service URL after first deploy
      - key: ANTHROPIC_API_KEY
        sync: false  # Optional — set for AI summarization
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: IMAGE_CACHE_DIR
        value: /app/data/images
      - key: MODEL_CACHE_DIR
        value: /app/data/models
databases:
  - name: savedpocket-db
    databaseName: savedpocket
    plan: starter
    postgresMajorVersion: 16
