<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 296px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #171717;
      background: #fafafa;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
    }
    .header-icon { color: #737373; flex-shrink: 0; }
    .header-title { font-weight: 600; font-size: 14px; }

    /* ── Section ── */
    .section {
      padding: 12px 14px;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
    }

    /* ── Presets ── */
    .preset-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .preset-btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      background: #f5f5f5;
      font-size: 12px;
      font-weight: 500;
      color: #525252;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }
    .preset-btn:hover { background: #e5e5e5; }
    .preset-btn.active {
      border-color: #171717;
      background: #171717;
      color: #fff;
    }

    /* ── Form fields ── */
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #737373;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      font-size: 12px;
      color: #171717;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #a3a3a3; }
    input::placeholder { color: #d4d4d4; }

    .key-wrap { position: relative; }
    .key-wrap input { padding-right: 34px; }
    .vis-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #a3a3a3;
      padding: 2px;
      display: flex;
      align-items: center;
    }
    .vis-btn:hover { color: #525252; }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
    }
    .btn-primary {
      flex: 1;
      padding: 7px 12px;
      background: #171717;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-primary:hover:not(:disabled) { background: #404040; }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }
    .btn-secondary {
      padding: 7px 11px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      font-size: 12px;
      color: #525252;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .btn-secondary:hover { background: #f5f5f5; }

    /* ── Status ── */
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      font-size: 12px;
      color: #a3a3a3;
      min-height: 36px;
    }
    .status.ok  { color: #059669; }
    .status.err { color: #dc2626; }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── Hint ── */
    .hint {
      padding: 0 14px 10px;
      font-size: 11px;
      color: #a3a3a3;
      line-height: 1.5;
    }
    .hint a { color: #737373; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <svg class="header-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    <span class="header-title">SavedPocket</span>
  </div>

  <div class="section">
    <div class="preset-row">
      <button class="preset-btn" id="btn-local">Local dev</button>
      <button class="preset-btn" id="btn-remote">Remote server</button>
    </div>

    <div class="field">
      <label for="server-url">Server URL</label>
      <input type="url" id="server-url" placeholder="http://localhost:3000" autocomplete="off" />
    </div>

    <div class="field">
      <label for="api-key">API Key</label>
      <div class="key-wrap">
        <input type="password" id="api-key" placeholder="Paste from Settings → API Key" autocomplete="off" />
        <button class="vis-btn" id="btn-vis" title="Show / hide key">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-save">Save &amp; Test</button>
    <button class="btn-secondary" id="btn-dash">Open Dashboard ↗</button>
  </div>

  <div class="status" id="status">
    <div class="status-dot"></div>
    <span id="status-text">Loading…</span>
  </div>

  <div class="hint" id="hint" style="display:none">
    Find your API Key in the dashboard under <a id="hint-link">Settings</a>.
  </div>

  <script src="popup.js"></script>
</body>
</html>
